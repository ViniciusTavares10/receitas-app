services:
  app-homolog:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: app-homolog
    env_file:
      - .env.homolog
    volumes:
      - ../../:/var/www/html
      - vendor-homolog:/var/www/html/vendor
    depends_on:
      db-homolog:
        condition: service_healthy
    networks:
      - homolog-net

  nginx-homolog:
    image: nginx:1.27-alpine
    container_name: nginx-homolog
    ports:
      - "8080:80"
    volumes:
      - ../../:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-homolog
    networks:
      - homolog-net

  db-homolog:
    image: postgres:15
    container_name: db-homolog
    environment:
      POSTGRES_DB: receitas_homolog
      POSTGRES_USER: receitas
      POSTGRES_PASSWORD: receitas_homolog
    volumes:
      - db-homolog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receitas -d receitas_homolog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homolog-net

volumes:
  db-homolog-data:
  vendor-homolog:

networks:
  homolog-net:
    driver: bridge