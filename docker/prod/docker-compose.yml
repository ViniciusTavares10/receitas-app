services:
  app-prod:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: app-prod
    env_file:
      - .env.prod
    volumes:
      - ../../:/var/www/html
    depends_on:
      db-prod:
        condition: service_healthy
    networks:
      - prod-net

  nginx-prod:
    image: nginx:1.27-alpine
    container_name: nginx-prod
    ports:
      - "80:80"
    volumes:
      - ../../:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-prod
    networks:
      - prod-net

  db-prod:
    image: postgres:15
    container_name: db-prod
    environment:
      POSTGRES_DB: receitas_prod
      POSTGRES_USER: receitas
      POSTGRES_PASSWORD: receitas_prod_change_me
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receitas -d receitas_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod-net

volumes:
  db-prod-data:

networks:
  prod-net:
    driver: bridge
